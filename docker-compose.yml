# Local development database: PostgreSQL 17 with the pgvector extension.
# Port 5433 on the host avoids clashing with any other local Postgres.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: casepilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: casepilot
      POSTGRES_PASSWORD: casepilot
      POSTGRES_DB: casepilot
    ports:
      - "5433:5432"
    volumes:
      - casepilot-pgdata:/var/lib/postgresql/data
      - ./scripts/db/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casepilot -d casepilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  casepilot-pgdata:
